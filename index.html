<!DOCTYPE html>
<html lang='fr'>
<head>
<meta charset='UTF-8'>
<meta name='viewport' content='width=device-width, initial-scale=1'>
<meta name='apple-mobile-web-app-capable' content='yes'>
<meta name='apple-mobile-web-app-title' content='Comptes'>
<meta name='theme-color' content='#0f172a'>
<title>Mes comptes</title>
<script src='https://cdn.jsdelivr.net/npm/chart.js'></script>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:linear-gradient(160deg,#0f172a,#1e1b4b);color:#e2e8f0;min-height:100vh}
.wrap{max-width:760px;margin:0 auto;padding:20px 14px 40px}
header{text-align:center;margin-bottom:18px}
h1{margin:0;font-size:28px}
header p{margin:4px 0 0;color:#94a3b8}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:14px}
.acc,.card{background:rgba(30,41,59,.85);border-radius:16px;padding:16px;box-shadow:0 4px 18px rgba(0,0,0,.25)}
.card{margin-bottom:14px}
.acc h3{margin:0 0 6px;font-size:15px;color:#94a3b8}
.big{font-size:22px;font-weight:700}
.row{display:flex;flex-direction:column;gap:2px;margin-top:8px;font-size:13px}
.pos{color:#4ade80}
.neg{color:#f87171}
h2{margin:0 0 12px;font-size:17px}
h4{margin:18px 0 4px;font-size:15px;color:#94a3b8}
form{display:grid;grid-template-columns:1fr 1fr;gap:8px}
input,select,button{font-size:16px;padding:11px;border-radius:10px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;font-family:inherit}
#cat,#label,.primary,#cancel{grid-column:1/-1}
#cancel{display:none;background:transparent}
.primary{background:linear-gradient(135deg,#6366f1,#8b5cf6);border:0;font-weight:600;color:#fff}
.head{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin-bottom:10px}
.head h2{margin:0}
.seg{display:flex;gap:4px;background:#0f172a;padding:3px;border-radius:10px}
.seg button{border:0;padding:6px 10px;font-size:13px;background:transparent;color:#94a3b8}
.seg button.on{background:#6366f1;color:#fff}
.chartbox{position:relative;height:280px}
.cat{display:flex;justify-content:space-between;font-weight:600;background:#0f172a;padding:10px 12px;border-radius:10px;margin-top:12px}
.item{display:flex;align-items:center;gap:8px;padding:8px 4px;border-bottom:1px solid #334155;font-size:14px}
.item .t{flex:1}
.item small{color:#94a3b8;display:block}
.badge{font-size:11px;padding:2px 8px;border-radius:99px;color:#0f172a;font-weight:600}
.x{background:#7f1d1d;border:0;padding:4px 10px;font-size:14px}
.ed{background:#334155;border:0;padding:4px 10px;font-size:14px}
.ghost{width:100%;background:transparent}
.empty{color:#94a3b8}
</style>
</head>
<body>
<div class='wrap'>
  <header><h1>Mes comptes</h1><p>Abbes · Entreprise</p></header>

  <section id='cards' class='grid'></section>

  <section class='card'>
    <h2 id='formTitle'>Nouvelle opération</h2>
    <form id='f'>
      <select id='account'><option>Abbes</option><option>Entreprise</option></select>
      <select id='type'><option value='revenu'>Revenu</option><option value='depense'>Dépense</option></select>
      <input type='date' id='date' required>
      <input type='number' step='0.01' id='amount' placeholder='Montant €' required>
      <input list='cats' id='cat' placeholder='Catégorie (ex : Loyer, Salaire)' required>
      <datalist id='cats'></datalist>
      <input id='label' placeholder='Libellé (facultatif)'>
      <button type='submit' class='primary' id='submit'>Ajouter</button>
      <button type='button' id='cancel'>Annuler la modification</button>
    </form>
  </section>

  <section class='card'>
    <div class='head'>
      <h2>Évolution par mois</h2>
      <div class='seg' id='metrics'>
        <button data-m='solde' class='on'>Solde</button>
        <button data-m='revenu'>Revenus</button>
        <button data-m='depense'>Dépenses</button>
      </div>
    </div>
    <div class='chartbox'><canvas id='chart'></canvas></div>
  </section>

  <section class='card'>
    <div class='head'>
      <h2>Détails</h2>
      <div class='seg' id='filters'></div>
    </div>
    <h4>Revenus</h4>
    <div id='incomes'></div>
    <h4>Dépenses par catégorie</h4>
    <div id='detail'></div>
  </section>

  <button class='ghost' id='export'>Exporter en CSV</button>
</div>

<script>
const COLORS = { Abbes: '#818cf8', Entreprise: '#fbbf24' };
const eur = n => n.toLocaleString('fr-FR', { style: 'currency', currency: 'EUR' });
const esc = s => { const d = document.createElement('div'); d.textContent = s; return d.innerHTML; };

let data = [];
try { data = JSON.parse(localStorage.getItem('ops') || '[]'); } catch (e) { data = []; }
data = data.map(o => Object.assign({ account: 'Abbes' }, o));
let metric = 'solde', filter = 'Tous', chart, editId = null;

const save = () => localStorage.setItem('ops', JSON.stringify(data));
const $ = id => document.getElementById(id);
const sumOf = (acc, type, m) => data
  .filter(o => o.account === acc && o.type === type && (!m || o.date.startsWith(m)))
  .reduce((s, o) => s + o.amount, 0);

function resetForm() {
  editId = null;
  $('f').reset();
  $('date').valueAsDate = new Date();
  $('submit').textContent = 'Ajouter';
  $('formTitle').textContent = 'Nouvelle opération';
  $('cancel').style.display = 'none';
}
resetForm();

$('f').onsubmit = e => {
  e.preventDefault();
  const op = {
    account: $('account').value,
    date: $('date').value,
    type: $('type').value,
    cat: $('cat').value.trim(),
    label: $('label').value.trim(),
    amount: parseFloat($('amount').value)
  };
  if (editId) {
    const o = data.find(x => x.id === editId);
    if (o) Object.assign(o, op);
  } else {
    data.push(Object.assign({ id: Date.now() }, op));
  }
  save();
  resetForm();
  render();
};

$('cancel').onclick = resetForm;

function edit(id) {
  const o = data.find(x => x.id === id);
  if (!o) return;
  editId = id;
  $('account').value = o.account;
  $('type').value = o.type;
  $('date').value = o.date;
  $('amount').value = o.amount;
  $('cat').value = o.cat;
  $('label').value = o.label || '';
  $('submit').textContent = 'Enregistrer la modification';
  $('formTitle').textContent = 'Modifier l\'opération';
  $('cancel').style.display = 'block';
  window.scrollTo({ top: 0, behavior: 'smooth' });
}

function del(id) {
  if (!confirm('Supprimer cette opération ?')) return;
  data = data.filter(o => o.id !== id);
  if (editId === id) resetForm();
  save();
  render();
}

$('metrics').onclick = e => {
  if (e.target.dataset.m) { metric = e.target.dataset.m; render(); }
};
$('filters').onclick = e => {
  if (e.target.dataset.f) { filter = e.target.dataset.f; render(); }
};

$('export').onclick = () => {
  const rows = ['date;compte;type;categorie;libelle;montant']
    .concat(data.map(o => [o.date, o.account, o.type, o.cat, o.label, o.amount].join(';')));
  const a = document.createElement('a');
  a.href = URL.createObjectURL(new Blob([rows.join('\n')], { type: 'text/csv' }));
  a.download = 'operations.csv';
  a.click();
};

const row = (o, sub) => `<div class='item'>
  <span class='badge' style='background:${COLORS[o.account] || '#94a3b8'}'>${esc(o.account)}</span>
  <span class='t'>${esc(o.label || o.cat)}<small>${sub}</small></span>
  <strong>${eur(o.amount)}</strong>
  <button class='ed' onclick='edit(${o.id})'>✎</button>
  <button class='x' onclick='del(${o.id})'>×</button>
</div>`;

function render() {
  const names = Object.keys(COLORS);

  // Cartes des comptes
  $('cards').innerHTML = names.map(a => {
    const r = sumOf(a, 'revenu'), d = sumOf(a, 'depense');
    return `<div class='acc' style='border-top:4px solid ${COLORS[a]}'>
      <h3>${a}</h3>
      <div class='big'>${eur(r - d)}</div>
      <div class='row'><span class='pos'>+ ${eur(r)}</span><span class='neg'>− ${eur(d)}</span></div>
    </div>`;
  }).join('');

  // Boutons du graphique
  document.querySelectorAll('#metrics button').forEach(b => b.classList.toggle('on', b.dataset.m === metric));

  // Graphique : une courbe par compte
  const months = [...new Set(data.map(o => o.date.slice(0, 7)))].sort();
  const val = (a, m) => metric === 'solde'
    ? sumOf(a, 'revenu', m) - sumOf(a, 'depense', m)
    : sumOf(a, metric, m);
  if (chart) chart.destroy();
  Chart.defaults.color = '#94a3b8';
  chart = new Chart($('chart'), {
    type: 'line',
    data: {
      labels: months,
      datasets: names.map(a => ({
        label: a,
        data: months.map(m => val(a, m)),
        borderColor: COLORS[a],
        backgroundColor: COLORS[a] + '33',
        fill: true,
        tension: 0.35,
        pointRadius: 4
      }))
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      scales: {
        x: { grid: { color: '#1e293b' } },
        y: { grid: { color: '#334155' } }
      }
    }
  });

  // Catégories proposées
  $('cats').innerHTML = [...new Set(data.map(o => o.cat))].map(c => `<option value='${esc(c)}'>`).join('');

  // Filtres
  $('filters').innerHTML = ['Tous'].concat(names)
    .map(f => `<button data-f='${f}' class='${f === filter ? 'on' : ''}'>${f}</button>`).join('');

  const visible = data.filter(o => filter === 'Tous' || o.account === filter);

  // Revenus
  const inc = visible.filter(o => o.type === 'revenu').sort((a, b) => b.date.localeCompare(a.date));
  $('incomes').innerHTML = inc.length
    ? inc.map(o => row(o, `${o.date} · ${esc(o.cat)}`)).join('')
    : "<p class='empty'>Aucun revenu pour le moment.</p>";

  // Dépenses par catégorie
  const dep = visible.filter(o => o.type === 'depense');
  const cats = [...new Set(dep.map(o => o.cat))].sort();
  $('detail').innerHTML = cats.length ? cats.map(c => {
    const items = dep.filter(o => o.cat === c).sort((a, b) => b.date.localeCompare(a.date));
    const total = items.reduce((s, o) => s + o.amount, 0);
    return `<div class='cat'><span>${esc(c)}</span><span>${eur(total)}</span></div>` +
      items.map(o => row(o, o.date)).join('');
  }).join('') : "<p class='empty'>Aucune dépense pour le moment.</p>";
}

render();
</script>
</body>
</html>
